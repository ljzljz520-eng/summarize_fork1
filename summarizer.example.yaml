# Summarizer Configuration
# Copy to ./summarizer.yaml or run: python -m summarizer --init-config

default_provider: groq

providers:
  groq:
    base_url: https://api.groq.com/openai/v1
    model: openai/gpt-oss-120b

  gemini:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    model: gemini-3.5-flash-lite

  deepseek:
    base_url: https://api.deepseek.com/v1
    model: deepseek-v4-flash

  openai:
    base_url: https://api.openai.com/v1
    model: gpt-5.5

  nvidia:
    base_url: https://integrate.api.nvidia.com/v1
    model: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning

  openrouter:
    base_url: https://openrouter.ai/api/v1
    model: google/gemini-3.1-flash-lite

  # Same provider, different model for text vs video
  openrouter-text:
    base_url: https://openrouter.ai/api/v1
    model: gpt-5.5

  openrouter-video:
    base_url: https://openrouter.ai/api/v1
    model: minimax/minimax-m3

  # URL mode: sends YouTube URLs directly without downloading
  openrouter-youtube:
    base_url: https://openrouter.ai/api/v1
    model: google/gemini-3.1-flash-lite
    visual-input-mode: url

  perplexity:
    base_url: https://openrouter.ai/api/v1
    model: perplexity/sonar
    chunk-size: 128000

  litellm-anthropic:
    base_url: litellm
    model: anthropic/claude-sonnet-4-6

  litellm-groq:
    base_url: litellm
    model: groq/llama-3.3-70b-versatile

# ─────────────────────────────────────────────────────────────────────
# URL Mode (Optional)
# ─────────────────────────────────────────────────────────────────────
# If your model supports receiving YouTube URLs directly, you can add
# visual-input-mode: url to skip downloading/splitting/encoding:
#
#   openrouter-minimax-youtube:
#     base_url: https://openrouter.ai/api/v1
#     model: minimax/minimax-m3
#     visual-input-mode: url
# ─────────────────────────────────────────────────────────────────────

defaults:
  prompt-type: Questions and answers
  chunk-size: 120000
  parallel-calls: 10
  max-tokens: 4096
  output-language: auto
  speed: 1.0
  use-proxy: false
  output-dir: summaries
  keep-history: false
  cobalt-base-url: http://localhost:9000
  cache-transcript: true
  cache-transcript-persist: false
  # cache-transcript-dir: summaries/.cache/transcripts
  # Docker: copy summarizer.docker.yaml or set SUMMARIZER_KEEP_HISTORY / SUMMARIZER_CACHE_PERSIST
  visual: false
  visual-compression: off
  visual-chunk-seconds: auto
  visual-chunk-overlap-seconds: 0
  # visual-max-size-mb: 100
  # visual-max-duration-seconds: 120

# ─────────────────────────────────────────────────────────────────────
# Server deployment (optional, used by `summarizer serve`)
# ─────────────────────────────────────────────────────────────────────
# Modes:
#   local-trusted        (default) No authentication; loopback bind only
#                        unless confirm_non_loopback: true. Historical
#                        single-user behavior.
#   authenticated-server Every endpoint except /health requires an API
#                        token or OIDC identity; only registered providers
#                        can be selected; api_key/base_url/model/cobalt_url
#                        request overrides are forbidden; the outbound
#                        policy below is enforced.
# Environment overrides: SUMMARIZER_DEPLOY_MODE, SUMMARIZER_API_TOKEN,
# SUMMARIZER_API_TOKEN_SCOPES, SUMMARIZER_OIDC_ISSUER/AUDIENCE/JWKS_URI,
# SUMMARIZER_LOCAL_SOURCE_ROOTS, SUMMARIZER_CORS_ORIGINS.
#
# server:
#   mode: authenticated-server
#   # cors_origins: ["https://summarize.example.com"]
#   # Required for local-trusted when binding 0.0.0.0:
#   # confirm_non_loopback: false
#   # Directories from which Local File/TXT sources may be read. Empty by
#   # default, which disables local path sources even with sources:local.
#   local_source_roots:
#     - /srv/summarizer/media
#   auth:
#     tokens:
#       - id: ops-token
#         # Set exactly one of: token (hashed at startup) or token_hash.
#         # token: plaintext-token-value
#         token_hash: sha256:64-char-hex-digest-of-the-token
#         scopes:
#           - summarize:read
#           - summarize:write
#           - summarize:upload
#           - sources:local
#           # - admin:config
#         # Optional provider allowlist for this identity (all when absent):
#         # providers: [groq, gemini]
#     # OIDC bearer JWTs (RS256/ES256) are accepted in addition to tokens:
#     # oidc:
#     #   issuer: https://login.example.com/realms/summarizer
#     #   audience: summarize-api
#     #   # Explicit JWKS URI. Required when the IdP hosts keys on a different
#     #   # origin than the issuer (e.g. Google/Microsoft); that origin is
#     #   # registered with the outbound policy automatically.
#     #   jwks_uri: https://login.example.com/realms/summarizer/protocol/openid-connect/certs
#     #   algorithms: [RS256, ES256]
#     #   scopes_claim: scope      # space-separated string, or use "scp" (array)
#     #   providers_claim: providers

# ─────────────────────────────────────────────────────────────────────
# Outbound policy (authenticated-server only)
# ─────────────────────────────────────────────────────────────────────
# All model/vision, Drive/Dropbox, Cobalt and generic video downloads pass
# through one policy layer: scheme/port validation, every resolved IP,
# every redirect and every connect target. Loopback, link-local, private
# ranges and DNS rebinding are rejected. Private-IP exemptions are bound to
# the exact registered origins and purposes; user-supplied download URLs
# never inherit an exemption, even when their hostname matches. There is no
# implicit localhost Cobalt in this mode: configure defaults.cobalt-base-url
# explicitly (and list it below when it resolves privately).
#
# outbound:
#   # Ports allowed for user-supplied download URLs (default 80/443).
#   allowed_ports: [80, 443]
#   # Hostname origins allowed to resolve to private IPs (e.g. a local or
#   # docker-host Cobalt). IP literals are never exempted; pinning applies
#   # only to resolutions of these hostnames.
#   allow_private_origins:
#     - http://localhost:9000
#     # - http://host.docker.internal:9000
#   # Additional private networks allowed for registered infrastructure:
#   allow_private_cidrs:
#     - 10.0.0.0/8